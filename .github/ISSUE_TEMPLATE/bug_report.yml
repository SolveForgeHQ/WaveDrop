name: 🐛 Bug Report
description: Report a bug, crash, or unexpected behavior in WaveDrop
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in WaveDrop! Please provide as much information as possible to help us reproduce and fix the issue.
  - type: dropdown
    id: package
    attributes:
      label: Affected Component
      description: Which part of the monorepo is affected?
      options:
        - "Contracts (Solidity / Foundry)"
        - "Backend API (Fastify / Prisma)"
        - "GitHub Webhook Service"
        - "Frontend (Next.js / wagmi)"
        - "Shared Package"
        - "Documentation / Dev Setup"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Start the backend with 'pnpm --filter @wavedrop/backend dev'
        2. Navigate to '...'
        3. Click '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Node.js version, browser, wallet (MetaMask, Core), etc.
      placeholder: |
        - OS: Windows / macOS / Linux
        - Node Version: v20.x
        - Browser: Chrome / Brave / Firefox
        - Wallet: Core / MetaMask
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional Context & Logs
      description: Paste any error logs, stack traces, or screenshots here.
    validations:
      required: false
