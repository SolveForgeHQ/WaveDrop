version: "3.9"

# ─────────────────────────────────────────────────────────────────
# WaveDrop – local development stack
#
# Usage:
#   docker compose up -d        # start Postgres in the background
#   docker compose down         # stop containers
#   docker compose down -v      # stop containers AND delete data
#
# The DATABASE_URL used by backend/.env should be:
#   postgresql://wavedrop:wavedrop@localhost:5432/wavedrop
# ─────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: wavedrop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     wavedrop
      POSTGRES_PASSWORD: wavedrop
      POSTGRES_DB:       wavedrop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavedrop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
